name: receipt_fold
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5
  collection: ^1.19.1
  dynamic_color: ^1.8.1
  audioplayers: ^6.5.1
  vibration: ^3.1.3
  fluttertoast: ^9.0.0
  intl: ^0.20.2
  url_launcher: ^6.3.2
  share_plus: ^12.0.1
  shared_preferences: ^2.5.4
  flutter_secure_storage: ^9.2.4
  flutter_vector_icons: ^2.0.0
  screen_brightness: ^2.1.7
  flutter_cache_manager: ^3.4.1
  cached_network_image: ^3.4.1
  barcode: ^2.2.9
  flutter_svg: ^2.2.3
  flutter_form_builder: ^10.2.0
  form_builder_validators: ^11.3.0
  home_widget: ^0.8.1
  path: ^1.9.1
  path_provider: ^2.1.5
  objectbox: ^5.2.0
  objectbox_flutter_libs: any
  dio: ^5.9.1
  html: ^0.15.6
  watashi_locale:
    git:
      url: https://github.com/oniyukai/watashi_locale.git
      ref: main
  uuid: ^4.5.2
  drift: ^2.31.0
  drift_flutter: ^0.2.8
  logger: ^2.6.2
  webdav_client: ^1.2.2
  es_compression: ^2.0.15

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.11.1
  objectbox_generator: any
  flutter_launcher_icons: ^0.14.4
  drift_dev: ^2.31.0

flutter:
  uses-material-design: true

  assets:
    - assets/

flutter_launcher_icons:
  android: 'ic_launcher'
  ios: true
  image_path: 'assets/appicon.png'

objectbox:
  output_dir: entity/objectbox